# Bowman Aviation PLM: a Frappe site standing in for Siemens Teamcenter.
#
# Upstream: https://github.com/frappe/frappe_docker/blob/main/pwd.yml
# Upstream commit: ce862c7b8113ac0c6b6b83becde126c980ef2d0b (main, checked 2026-10-24).
# The file itself last changed in 4896ec52d7abf29442751860dcba16f8b550cc93.
# This is the same file bowman/erp/compose.yml starts from, with the changes below.
#
# Changes from upstream pwd.yml (everything else is verbatim):
#   1. Added `name: bowman-plm` so compose names every container, volume and network
#      bowman-plm-*, and cannot collide with other projects on the host (bowman-erp runs
#      beside it).
#   2. Published port is 127.0.0.1:8082 -> 8080 (upstream: 0.0.0.0:8080). The ERP uses 8081;
#      8080 cannot be bound on Tyler's laptop. Reach it through an SSH tunnel (NOTES.md).
#   3. Image: frappe/erpnext:v16.52.1, the tag bowman-erp already pulled. The site below installs
#      only the `frappe` app, so no ERPNext module is active in the PLM. mariadb:11.8 and
#      redis:6.2-alpine are as upstream.
#   4. create-site does not pass `--install-app erpnext` (the site gets frappe only), and after the
#      site exists it sets `server_script_enabled` in common_site_config.json (Frappe reads that flag
#      only from the bench-wide file). Server Scripts are off by default;
#      the PLM uses three small ones (see NOTES.md). The file lives in this stack's own
#      sites volume, so it cannot touch the ERP.
#   5. Passwords come from the environment instead of the literal `admin`:
#        PLM_ADMIN_PASSWORD             -> Administrator login (create-site service)
#        BOWMAN_PLM_DB_ROOT_PASSWORD    -> MariaDB root (db, backend, create-site services)
#      Compose refuses to start if either is unset. up.sh supplies both. Both are read only
#      when the site is first created (empty volumes); changing them later changes nothing.
#
# Not run directly. Use bowman/plm/up.sh.

name: bowman-plm

services:
  backend:
    image: frappe/erpnext:v16.52.1
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      MYSQL_ROOT_PASSWORD: ${BOWMAN_PLM_DB_ROOT_PASSWORD:?set in .env}
      MARIADB_ROOT_PASSWORD: ${BOWMAN_PLM_DB_ROOT_PASSWORD:?set in .env}
    depends_on:
      configurator:
        condition: service_completed_successfully

  configurator:
    image: frappe/erpnext:v16.52.1
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: none
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs

  create-site:
    image: frappe/erpnext:v16.52.1
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: none
    environment:
      ADMIN_PASSWORD: ${PLM_ADMIN_PASSWORD:?set in .env}
      MYSQL_ROOT_PASSWORD: ${BOWMAN_PLM_DB_ROOT_PASSWORD:?set in .env}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    entrypoint:
      - bash
      - -c
    command:
      - >
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
          [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "could not find sites/common_site_config.json with required keys";
            exit 1
          fi
        done;
        echo "sites/common_site_config.json found";
        if [ -d "sites/frontend" ]; then
          echo "Site frontend already exists, skipping creation";
        else
          bench new-site --mariadb-user-host-login-scope='%' --admin-password=$$ADMIN_PASSWORD --db-root-username=root --db-root-password=$$MYSQL_ROOT_PASSWORD --set-default frontend;
        fi;
        bench set-config -gp server_script_enabled 1;

  db:
    image: mariadb:11.8
    networks:
      - frappe_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MYSQL_ROOT_PASSWORD: ${BOWMAN_PLM_DB_ROOT_PASSWORD:?set in .env}
      MARIADB_ROOT_PASSWORD: ${BOWMAN_PLM_DB_ROOT_PASSWORD:?set in .env}
    volumes:
      - db-data:/var/lib/mysql

  frontend:
    image: frappe/erpnext:v16.52.1
    networks:
      - frappe_network
    depends_on:
      - websocket
      - backend
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      FRAPPE_SITE_NAME_HEADER: frontend
      SOCKETIO: websocket:9000
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: 120
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    ports:
      - "127.0.0.1:8082:8080"

  queue-long:
    image: frappe/erpnext:v16.52.1
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - worker
      - --queue
      - long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

  queue-short:
    image: frappe/erpnext:v16.52.1
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - worker
      - --queue
      - short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    depends_on:
      configurator:
        condition: service_completed_successfully

  redis-queue:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    volumes:
      - redis-queue-data:/data

  redis-cache:
    image: redis:6.2-alpine
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure

  scheduler:
    image: frappe/erpnext:v16.52.1
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - bench
      - schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

  websocket:
    image: frappe/erpnext:v16.52.1
    networks:
      - frappe_network
    deploy:
      restart_policy:
        condition: on-failure
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    environment:
      FRAPPE_REDIS_CACHE: redis://redis-cache:6379
      FRAPPE_REDIS_QUEUE: redis://redis-queue:6379
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      configurator:
        condition: service_completed_successfully

volumes:
  db-data:
  redis-queue-data:
  sites:
  logs:

networks:
  frappe_network:
    driver: bridge
